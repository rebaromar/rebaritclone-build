name: Review REBARIT CLONE 19.22 native design
on:
  push:
    branches: ['codex/design-19-22']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract and apply design
        run: |
          unzip -q rebaritclone-source.zip
          git apply patches/rebarit-v19.22.patch
      - name: Check existing pairing and USB protections
        run: |
          mkdir -p test-classes
          javac --release 8 -encoding UTF-8 -d test-classes ClonePhone/app/src/main/java/com/abdulla/clonephone/NearbyProtocol.java ClonePhone/tests/NearbyProtocolTest.java ClonePhone/app/src/main/java/com/abdulla/clonephone/UsbPermissionGate.java ClonePhone/tests/UsbPermissionGateTest.java
          java -cp test-classes com.abdulla.clonephone.NearbyProtocolTest
          java -cp test-classes com.abdulla.clonephone.UsbPermissionGateTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug preview
        working-directory: ClonePhone
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Start native Android emulator
        run: |
          set -euo pipefail
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          printf 'no\n' | avdmanager create avd --name design --package "system-images;android-35;google_apis;x86_64" --device pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -avd design -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics > /tmp/design-emulator.log 2>&1 &
          timeout 180 adb wait-for-device || { cat /tmp/design-emulator.log; exit 1; }
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb install -r ClonePhone/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant com.abdulla.clonephone android.permission.CAMERA
      - name: Capture real native screens
        run: |
          set -euo pipefail
          mkdir -p previews
          for lang in ckb en; do
            for screen in home roles usb selection transfer picker scan installer; do
              adb shell am force-stop com.abdulla.clonephone
              adb shell am start -W -n com.abdulla.clonephone/.DesignPreviewActivity --es screen "$screen" --es language "$lang"
              sleep 2
              adb exec-out screencap -p > "previews/$screen-$lang.png"
            done
          done
          adb shell settings put system font_scale 1.3
          adb shell wm size 720x1280
          adb shell wm density 320
          adb shell am force-stop com.abdulla.clonephone
          adb shell am start -W -n com.abdulla.clonephone/.DesignPreviewActivity --es screen selection --es language ckb
          sleep 2
          adb exec-out screencap -p > previews/selection-small-large-font.png
          adb shell am force-stop com.abdulla.clonephone
          adb shell am start -W -n com.abdulla.clonephone/.DesignPreviewActivity --es screen transfer --es language ckb
          sleep 2
          adb exec-out screencap -p > previews/transfer-small-large-font.png
          adb shell uiautomator dump /sdcard/window.xml
          adb pull /sdcard/window.xml previews/small-window.xml
          adb logcat -d -s AndroidRuntime > previews/android-runtime.log
          if grep -q 'FATAL EXCEPTION' previews/android-runtime.log; then cat previews/android-runtime.log; exit 1; fi
      - name: Keep native previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebarit-19.22-native-preview
          path: previews/
          retention-days: 7
