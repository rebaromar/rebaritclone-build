name: Validate REBAR IT Clone performance changes

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract source archive
        run: unzip -q rebaritclone-source.zip
      - name: Test pairing and band policy
        run: |
          set -euo pipefail
          mkdir -p test-classes
          javac --release 8 -encoding UTF-8 -d test-classes \
            ClonePhone/app/src/main/java/com/abdulla/clonephone/NearbyProtocol.java \
            ClonePhone/tests/NearbyProtocolTest.java \
            ClonePhone/app/src/main/java/com/abdulla/clonephone/WifiBandPolicy.java \
            ClonePhone/tests/WifiBandPolicyTest.java
          java -cp test-classes com.abdulla.clonephone.NearbyProtocolTest
          java -cp test-classes WifiBandPolicyTest
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build APK (no publish)
        working-directory: ClonePhone
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
