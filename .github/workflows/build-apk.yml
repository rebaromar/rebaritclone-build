name: REBAR IT - Automatic Build & Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rebaritclone-source.zip'
      - 'release-notes.txt'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: rebarit-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf source
          mkdir -p source
          unzip -q rebaritclone-source.zip -d source

          if [ ! -f "source/ClonePhone/gradlew" ]; then
            echo "::error::ClonePhone/gradlew not found inside ZIP"
            exit 1
          fi

          # Upgrade the production source archive once, preserving all current files.
          SOURCE_VERSION=$(grep -oE "versionName '[^']+'" source/ClonePhone/app/build.gradle | head -n1 | cut -d"'" -f2)
          if [ "$SOURCE_VERSION" = "19.19" ]; then
            git apply --directory=source patches/rebarit-v19.20.patch
            rm -f rebaritclone-source.zip
            (cd source && zip -qr -X ../rebaritclone-source.zip ClonePhone)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rebaritclone-source.zip
            git commit -m "Update source archive to REBARIT CLONE 19.20"
            git push origin HEAD:main
          fi

      - name: Read app version automatically
        shell: bash
        run: |
          GRADLE_FILE="source/ClonePhone/app/build.gradle"

          VERSION_NAME=$(sed -nE \
            "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" \
            "$GRADLE_FILE" | head -n1)

          VERSION_CODE=$(sed -nE \
            's/.*versionCode[[:space:]]+([0-9]+).*/\1/p' \
            "$GRADLE_FILE" | head -n1)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "Detected version: $VERSION_NAME ($VERSION_CODE)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test automatic pairing protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p protocol-test-classes
          javac --release 8 -encoding UTF-8 -d protocol-test-classes \
            source/ClonePhone/app/src/main/java/com/abdulla/clonephone/NearbyProtocol.java \
            source/ClonePhone/tests/NearbyProtocolTest.java
          java -cp protocol-test-classes com.abdulla.clonephone.NearbyProtocolTest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle executable
        run: chmod +x source/ClonePhone/gradlew

      - name: Build APK
        working-directory: source/ClonePhone
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare APK
        run: |
          cp source/ClonePhone/app/build/outputs/apk/release/app-release.apk \
          "REBAR-IT-Clone-${VERSION_NAME}.apk"

      - name: Verify original-app update compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="REBAR-IT-Clone-${VERSION_NAME}.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --print-certs "$APK" > apk-signature.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: 69539fd2465d035bd618755a8cbcbfca402f88d449c5b6611f649d58ad7b3c7e' apk-signature.txt
          "$TOOLS/aapt2" dump badging "$APK" > apk-badging.txt
          grep -Fq "package: name='com.abdulla.clonephone' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" apk-badging.txt
          echo "Package, version and original 18.9 signing certificate verified."

      - name: Keep APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: REBAR-IT-Clone-${{ env.VERSION_NAME }}
          path: REBAR-IT-Clone-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          APK="REBAR-IT-Clone-${VERSION_NAME}.apk"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "REBARIT CLONE ${VERSION_NAME}" \
              --notes-file release-notes.txt --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --title "REBARIT CLONE ${VERSION_NAME}" \
              --notes-file release-notes.txt --repo "$GITHUB_REPOSITORY"
          fi
