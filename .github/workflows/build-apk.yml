name: REBAR IT - Build and Auto Publish 9.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rebaritclone-v9.6-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: rebarit-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check publishing password
        env:
          UPDATE_ADMIN_PASSWORD: ${{ secrets.UPDATE_ADMIN_PASSWORD }}
        run: |
          if [ -z "$UPDATE_ADMIN_PASSWORD" ]; then
            echo "::error::UPDATE_ADMIN_PASSWORD secret is missing"
            exit 1
          fi

      - name: Extract project
        run: |
          rm -rf source
          mkdir -p source
          unzip -q rebaritclone-v9.6-source.zip -d source

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle executable
        run: chmod +x source/ClonePhone/gradlew

      - name: Build APK
        working-directory: source/ClonePhone
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp source/ClonePhone/app/build/outputs/apk/debug/app-debug.apk \
          REBAR-IT-Clone-9.6.apk

      - name: Keep APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: REBAR-IT-Clone-9.6
          path: REBAR-IT-Clone-9.6.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload and publish update
        env:
          UPDATE_ADMIN_PASSWORD: ${{ secrets.UPDATE_ADMIN_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import urllib.request
          import urllib.parse
          from pathlib import Path

          BASE = "https://rebaritclone-update-admin.rebar4qwrna.workers.dev"
          PASSWORD = os.environ["UPDATE_ADMIN_PASSWORD"]
          APK = Path("REBAR-IT-Clone-9.6.apk")

          def call(path, data, content_type):
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  method="POST",
                  headers={
                      "X-Admin-Password": PASSWORD,
                      "Content-Type": content_type,
                      "Accept": "application/json",
                      "User-Agent": "REBAR-IT-GitHub-Actions/1.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=180) as response:
                  return json.load(response)

          upload = call(
              "/api/upload",
              APK.read_bytes(),
              "application/vnd.android.package-archive"
          )

          apk_url = upload["apkUrl"]

          release = {
              "versionCode": 39,
              "versionName": "9.6",
              "apkUrl": apk_url,
              "notes": "شاشەی نوێی گواستنەوەی فایل زیاد کرا"
          }

          result = call(
              "/api/publish",
              json.dumps(release, ensure_ascii=False).encode("utf-8"),
              "application/json; charset=utf-8"
          )

          if result.get("ok") is not True:
              raise SystemExit("Publish failed: " + str(result))

          print("REBAR IT 9.6 published successfully")
          print("APK:", apk_url)
          PYCODE
