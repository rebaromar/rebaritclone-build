name: Build REBAR IT Clone 9.1

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: unzip -q rebaritclone-v9.1-source.zip -d source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build APK
        working-directory: source/ClonePhone
        run: bash gradlew --no-daemon assembleDebug
      - name: Name APK
        run: cp source/ClonePhone/app/build/outputs/apk/debug/app-debug.apk REBAR-IT-Clone-9.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: REBAR-IT-Clone-9.1
          path: REBAR-IT-Clone-9.1.apk
          if-no-files-found: error
