name: REBAR IT - Build and Publish

'on':
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ClonePhone/**
      - release-version.txt
      - release-notes.txt
      - .github/workflows/build-apk.yml

permissions:
  contents: write

concurrency:
  group: rebarit-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check publishing secret
        env:
          UPDATE_ADMIN_PASSWORD: ${{ secrets.UPDATE_ADMIN_PASSWORD }}
        run: |
          if [ -z "$UPDATE_ADMIN_PASSWORD" ]; then
            echo '::error::Add UPDATE_ADMIN_PASSWORD in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi

      - name: One-time source migration and update support
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile,hashlib,base64,zlib
          p=Path('ClonePhone')
          if not p.exists():
              blob=Path('rebaritclone-v9.2-source.zip').read_bytes()
              assert hashlib.sha1(b'blob '+str(len(blob)).encode()+b'\0'+blob).hexdigest()=='2534fd4db0945fd9a3130d85a8adbf52ee0f7c9a', 'Source changed; review before migration'
              with zipfile.ZipFile('rebaritclone-v9.2-source.zip') as z:
                  for info in z.infolist():
                      dest=Path(info.filename)
                      assert not dest.is_absolute() and '..' not in dest.parts and dest.parts[0]=='ClonePhone'
                  z.extractall('.')
              java=p/'app/src/main/java/com/abdulla/clonephone'
              (java/'OnlineUpdate.java').write_bytes(zlib.decompress(base64.b64decode('')))
              f=java/'MainActivity.java'
              s=f.read_text()
              old='options.getMenu().add(UiText.t(290)).setOnMenuItemClickListener(i->{appDownloadPage();return true;});'
              assert old in s
              f.write_text(s.replace(old,'options.getMenu().add(onlineUpdate.menuTitle()).setOnMenuItemClickListener(i->{onlineUpdate.checkManually();return true;});'))
              f=p/'app/build.gradle'
              f.write_text(f.read_text().replace('versionCode 35','versionCode 36').replace("versionName '9.2'","versionName '9.3'"))
              Path('release-version.txt').write_text('9.3\n')
              Path('release-notes.txt').write_text('Automatic update checks with Update / Later.\n')
              Path('ClonePhone/.gitignore').write_text('.gradle/\nbuild/\n**/build/\nlocal.properties\n')
          PYCODE

      - name: Save editable sources to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add ClonePhone release-version.txt release-notes.txt

          if ! git diff --cached --quiet; then
            git commit -m 'Keep Android sources editable and enable update prompts [skip ci]'

            git fetch origin main
            git rebase origin/main

            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi

              if [ "$attempt" = "3" ]; then
                echo "::error::Could not push after 3 attempts because main kept changing."
                exit 1
              fi

              git fetch origin main
              git rebase origin/main
            done
          fi

          echo "PUBLISH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set increasing build number
        run: |
          python3 - <<'PYCODE'
          import json,re,urllib.request,os
          from pathlib import Path

          base='https://rebaritclone-update-admin.rebar4qwrna.workers.dev'

          with urllib.request.urlopen(base+'/update.json',timeout=30) as r:
              current=json.load(r)

          p=Path('ClonePhone/app/build.gradle')
          s=p.read_text()

          previous=int(current['versionCode'])

          code=max(
              previous+1,
              int(re.search(r'versionCode\s+(\d+)',s)[1]),
              100+int(os.environ['GITHUB_RUN_NUMBER'])
          )

          name=Path('release-version.txt').read_text().strip()

          assert re.fullmatch(
              r'[0-9]+(?:\.[0-9]+){1,3}',
              name
          ), 'Use a version such as 9.3'

          assert 0 < code < 2100000000

          s=re.sub(
              r'versionCode\s+\d+',
              'versionCode '+str(code),
              s
          )

          s=re.sub(
              r"versionName\s+'[^']+'",
              "versionName '"+name+"'",
              s
          )

          p.write_text(s)

          Path('release.json').write_text(
              json.dumps(
                  dict(
                      versionCode=code,
                      versionName=name,
                      notes=Path('release-notes.txt').read_text()[:4000]
                  )
              )
          )
          PYCODE

      - name: Build signed APK
        working-directory: ClonePhone
        run: bash gradlew --no-daemon assembleDebug

      - name: Name APK
        run: |
          cp ClonePhone/app/build/outputs/apk/debug/app-debug.apk REBAR-IT-Clone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: REBAR-IT-Clone
          path: REBAR-IT-Clone.apk
          if-no-files-found: error

      - name: Ensure this is still the newest commit
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PUBLISH_SHA" || {
            echo 'A newer commit exists; skipping old publication.'
            exit 1
          }

      - name: Publish APK to existing update website
        env:
          UPDATE_ADMIN_PASSWORD: ${{ secrets.UPDATE_ADMIN_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import json,os,time,urllib.request,urllib.error,urllib.parse
          from pathlib import Path

          base='https://rebaritclone-update-admin.rebar4qwrna.workers.dev'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None

          opener=urllib.request.build_opener(NoRedirect())

          secret=os.environ['UPDATE_ADMIN_PASSWORD']

          if not secret:
              raise SystemExit(
                  'Add UPDATE_ADMIN_PASSWORD in GitHub Actions secrets first'
              )

          def request(path,data=None,kind='application/json'):
              headers={
                  'Content-Type':kind,
                  'Cache-Control':'no-cache'
              }

              if data is not None:
                  headers['X-Admin-Password']=secret

              req=urllib.request.Request(
                  base+path,
                  data=data,
                  headers=headers
              )

              with opener.open(req,timeout=180) as r:
                  return json.load(r)

          release=json.loads(
              Path('release.json').read_text()
          )

          current=request('/update.json')

          if int(current['versionCode']) >= release['versionCode']:
              raise SystemExit(
                  'A newer or equal build is published; run workflow again'
              )

          apk=Path('REBAR-IT-Clone.apk').read_bytes()

          assert len(apk) <= 20*1024*1024, \
              'APK exceeds upload limit'

          upload=request(
              '/api/upload',
              apk,
              'application/vnd.android.package-archive'
          )

          url=urllib.parse.urlsplit(upload['apkUrl'])

          assert (
              url.scheme=='https'
              and url.netloc==urllib.parse.urlsplit(base).netloc
              and url.path.startswith('/apk/')
          )

          assert (
              upload['versionCode']==release['versionCode']
          ), 'Uploaded APK version mismatch'

          release['apkUrl']=upload['apkUrl']

          for attempt in range(6):
              try:
                  result=request(
                      '/api/publish',
                      json.dumps(release).encode()
                  )

                  assert result.get('ok') is True
                  break

              except urllib.error.HTTPError as e:
                  if e.code not in (409,429,503) or attempt==5:
                      raise SystemExit(
                          'Publishing failed: HTTP '+str(e.code)
                      )

                  time.sleep(15)

          else:
              raise SystemExit('Publishing failed')

          print(
              'Published version '
              +release['versionName']
              +' ('
              +str(release['versionCode'])
              +')'
          )
          PYCODE
