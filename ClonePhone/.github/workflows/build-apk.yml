name: REBAR IT - Automatic Build & Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rebaritclone-source.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: read

concurrency:
  group: rebarit-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check publishing secret
        env:
          UPDATE_ADMIN_PASSWORD: ${{ secrets.UPDATE_ADMIN_PASSWORD }}
        run: |
          if [ -z "$UPDATE_ADMIN_PASSWORD" ]; then
            echo "::error::Add UPDATE_ADMIN_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare source
        run: |
          set -euo pipefail

          test -f rebaritclone-source.zip || {
            echo "::error::rebaritclone-source.zip not found."
            exit 1
          }

          rm -rf source
          mkdir source

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          src = Path("rebaritclone-source.zip")
          dest = Path("source")

          with zipfile.ZipFile(src) as z:
              for info in z.infolist():
                  p = Path(info.filename)

                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(
                          "Unsafe path in ZIP: " + info.filename
                      )

              z.extractall(dest)

          project = dest / "ClonePhone"

          if not (project / "gradlew").exists():
              raise SystemExit(
                  "ZIP must contain top-level ClonePhone/"
              )
          PY

          chmod +x source/ClonePhone/gradlew

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Build APK
        working-directory: source/ClonePhone
        run: |
          ./gradlew --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          cp \
            source/ClonePhone/app/build/outputs/apk/debug/app-debug.apk \
            REBAR-IT-Clone.apk

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          gradle = Path(
              "source/ClonePhone/app/build.gradle"
          ).read_text()

          code_match = re.search(
              r"versionCode\s+(\d+)",
              gradle
          )

          name_match = re.search(
              r"versionName\s+['\"]([^'\"]+)['\"]",
              gradle
          )

          if not code_match or not name_match:
              raise SystemExit(
                  "versionCode/versionName not found"
              )

          version_code = int(code_match.group(1))
          version_name = name_match.group(1)

          notes = "REBARIT CLONE " + version_name

          for candidate in [
              Path("source/ClonePhone/release-notes.txt"),
              Path("release-notes.txt"),
          ]:
              if candidate.exists():
                  value = candidate.read_text(
                      errors="replace"
                  ).strip()

                  if value:
                      notes = value[:4000]
                      break

          Path("release.json").write_text(
              json.dumps({
                  "versionCode": version_code,
                  "versionName": version_name,
                  "notes": notes
              })
          )

          print(
              "Version:",
              version_name,
              "Code:",
              version_code
          )
          PY

      - name: Keep APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: REBAR-IT-Clone
          path: REBAR-IT-Clone.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload and publish automatically
        env:
          UPDATE_ADMIN_PASSWORD: ${{ secrets.UPDATE_ADMIN_PASSWORD }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error
          import urllib.parse

          from pathlib import Path

          base = (
              "https://rebaritclone-update-admin."
              "rebar4qwrna.workers.dev"
          )

          secret = os.environ[
              "UPDATE_ADMIN_PASSWORD"
          ].strip()

          if not secret:
              raise SystemExit(
                  "UPDATE_ADMIN_PASSWORD is empty"
              )

          release = json.loads(
              Path("release.json").read_text()
          )

          apk = Path(
              "REBAR-IT-Clone.apk"
          ).read_bytes()

          def post(path, data, content_type):

              req = urllib.request.Request(
                  base + path,
                  data=data,
                  method="POST",
                  headers={
                      "X-Admin-Password": secret,
                      "Content-Type": content_type,
                      "Cache-Control": "no-cache",
                      "User-Agent":
                          "REBARIT-Clone-GitHub-Actions"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=180
              ) as response:

                  return json.load(response)

          upload = post(
              "/api/upload",
              apk,
              "application/vnd.android.package-archive"
          )

          apk_url = upload.get("apkUrl")

          if not apk_url:
              raise SystemExit(
                  "apkUrl missing"
              )

          if int(
              upload.get("versionCode", -1)
          ) != int(
              release["versionCode"]
          ):
              raise SystemExit(
                  "Uploaded APK version mismatch"
              )

          apk_parts = urllib.parse.urlsplit(
              apk_url
          )

          base_parts = urllib.parse.urlsplit(
              base
          )

          if (
              apk_parts.scheme != "https"
              or
              apk_parts.netloc != base_parts.netloc
          ):
              raise SystemExit(
                  "Unexpected APK URL"
              )

          release["apkUrl"] = apk_url

          payload = json.dumps(
              release
          ).encode("utf-8")

          for attempt in range(6):

              try:

                  result = post(
                      "/api/publish",
                      payload,
                      "application/json"
                  )

                  if result.get("ok") is not True:
                      raise RuntimeError(
                          "Publish did not return ok=true"
                      )

                  print(
                      "Published",
                      release["versionName"],
                      release["versionCode"]
                  )

                  break

              except urllib.error.HTTPError as error:

                  if (
                      error.code not in
                      (409, 429, 503)
                      or attempt == 5
                  ):
                      raise

                  time.sleep(15)
          PY
