name: Build REBAR IT Clone 9.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk REBAR-IT-Clone-9.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REBAR-IT-Clone-9.1
          path: REBAR-IT-Clone-9.1.apk
          if-no-files-found: error
