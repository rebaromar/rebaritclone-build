plugins { id 'com.android.application' }
android {
    namespace 'com.abdulla.clonephone'
    compileSdk 35
    defaultConfig {
        applicationId 'com.abdulla.clonephone'
        minSdk 26
        targetSdk 34
        versionCode 36
        versionName '9.3'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            storeFile rootProject.file('test-signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

dependencies { implementation files('libs/zxing-core-3.5.3.jar') }
